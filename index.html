<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Permissions-Policy" content="microphone=(self), geolocation=(self), camera=()" />
    <title>MotoRide</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Teselas del mapa base y tiles de lluvia: abrir la conexión antes de que Leaflet las pida -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <!-- Fuentes alojadas en el propio dominio (SIL OFL, ver public/fonts/OFL.txt): sin peticiones a Google.

    <link rel="preload" href="/fonts/barlowcondensed-normal-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plusjakartasans-normal-200-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="theme-color" content="#f4efe6">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MotoRide">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="/boot.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
